# The site, over plain http. A template: bootstrap.sh fills in the hostnames
# from SERVER_NAMES and installs it as /etc/nginx/sites-available/garden.
#
# The names live in the config because a repository should not have to know
# what it is called. A clone serves whatever host its own config names.
#
# Matching on server_name rather than claiming `default_server` keeps this
# additive: on a box with other vhosts, nothing has to be disabled to put the
# site up and nothing has to be restored to take it down.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    access_log /var/log/nginx/garden.access.log;
    error_log  /var/log/nginx/garden.error.log;

    # The deploy hook and the gallery, on hookd. Exact match for /deploy: a
    # prefix location would also swallow /deployment-anything.
    location = /deploy {
        proxy_pass http://127.0.0.1:8001;
        include proxy_params;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        include proxy_params;
    }

    # Everything else is the site itself. garden.c is single-threaded and
    # closes the connection after each request, which is exactly what nginx's
    # default HTTP/1.0 upstream does — do not add keepalive here, it would
    # leave the loop waiting on a connection that is never coming back.
    location / {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }
}
